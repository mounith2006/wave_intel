services:
  - type: web
    name: waveintel-backend
    env: node
    plan: free
    rootDir: signal-analysis-platform/backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: PYTHON_ENGINE_URL
        sync: false

      - key: FRONTEND_URL
        sync: false

  - type: web
    name: waveintel-dsp
    env: python
    plan: free
    rootDir: signal-analysis-platform
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn signal_engine.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health