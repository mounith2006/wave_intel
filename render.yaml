services:
  - type: web
    name: waveintel-backend
    env: node
    plan: free
    rootDir: signal-analysis-platform/backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PYTHON_ENGINE_URL
        fromService:
          type: web
          name: waveintel-dsp
          property: url
      - key: FRONTEND_URL
        value: https://your-app.vercel.app

  - type: web
    name: waveintel-dsp
    env: python
    plan: free
    rootDir: signal-analysis-platform
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn signal_engine.main:app --host 0.0.0.0 --port $PORT
