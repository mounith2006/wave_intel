version: '3.8'

services:
  signal_engine:
    build:
      context: .
      dockerfile: docker/Dockerfile.signal_engine
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./processed:/app/processed
      - ./reports:/app/reports
    environment:
      - PYTHONUNBUFFERED=1

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "5000:5000"
    depends_on:
      - signal_engine
    environment:
      - PORT=5000
      - PYTHON_ENGINE_URL=http://signal_engine:8000
    volumes:
      - ./uploads:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
