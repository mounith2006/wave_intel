services:
  # 1. Node.js Backend & Socket.io Web Service
  - type: web
    name: waveintel-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_ENGINE_URL
        fromService:
          type: web
          name: waveintel-dsp
          property: hostport
      - key: FRONTEND_URL
        value: https://your-app.vercel.app

  # 2. Python FastAPI DSP Engine Web Service
  - type: web
    name: waveintel-dsp
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn signal_engine.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
